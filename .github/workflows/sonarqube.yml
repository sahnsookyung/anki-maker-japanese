name: SonarQube Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: sonarqube-${{ github.workflow }}-${{ github.event.pull_request.number || github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout code
        # actions/checkout v4.2.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        # astral-sh/setup-uv v5.4.0
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.2"

      - name: Set up Python
        # actions/setup-python v6.2.0
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Set up Node
        # actions/setup-node v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install backend dependencies
        run: |
          cd backend
          uv sync --group dev

      - name: Install frontend dependencies
        run: |
          cd apps/web
          npm ci

      - name: Run backend tests with coverage
        run: |
          cd backend
          uv run pytest \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term

      - name: Run frontend tests with coverage
        run: |
          cd apps/web
          npm run test:coverage
        env:
          CI: true

      - name: Verify coverage reports
        run: |
          test -f backend/coverage.xml
          test -f apps/web/coverage/lcov.info

      - name: SonarQube Scan
        # SonarSource/sonarqube-scan-action pinned by SHA.
        uses: SonarSource/sonarqube-scan-action@299e4b793aaa83bf2aba7c9c14bedbb485688ec4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload coverage artifacts
        if: always()
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-reports
          path: |
            backend/coverage.xml
            apps/web/coverage/
          retention-days: 7
