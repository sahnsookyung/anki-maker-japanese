# SonarQube/SonarCloud configuration for anki-maker-japanese.

sonar.projectKey=sahnsookyung_anki-maker-japanese
sonar.projectName=anki-maker-japanese
sonar.projectVersion=1.0.0
sonar.organization=sahnsookyung

sonar.sources=backend/app,apps/web/app,apps/web/components,apps/web/lib,scripts
sonar.tests=backend/app/tests,apps/web/tests
sonar.sourceEncoding=UTF-8

sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/coverage.xml

sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info
sonar.typescript.lcov.reportPaths=apps/web/coverage/lcov.info
sonar.typescript.tsconfigPaths=apps/web/tsconfig.json

sonar.exclusions=\
  **/__pycache__/**,\
  **/*.pyc,\
  **/.venv/**,\
  **/node_modules/**,\
  **/.next/**,\
  backend/uploads/**,\
  backend/processed/**,\
  backend/crops/**,\
  backend/exports/**,\
  backend/credentials/**,\
  backend/*.db

sonar.test.exclusions=\
  **/tests/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx

sonar.coverage.exclusions=\
  **/tests/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  apps/web/app/**,\
  apps/web/components/**,\
  apps/web/app/error.tsx,\
  apps/web/app/global-error.tsx,\
  apps/web/app/not-found.tsx,\
  apps/web/scripts/**,\
  backend/app/api/routes.py,\
  backend/app/core/images.py,\
  backend/app/db/database.py,\
  backend/app/evaluation/mcq_eval.py,\
  backend/app/evaluation/vocab_eval.py,\
  backend/app/extraction/**,\
  backend/app/ocr/**,\
  backend/app/vision/**,\
  backend/app/ocr/google_vision_provider.py,\
  backend/app/ocr/tesseract_provider.py

sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S3776
sonar.issue.ignore.multicriteria.e1.resourceKey=backend/app/**/*.py

sonar.cpd.exclusions=\
  **/tests/**,\
  apps/web/app/error.tsx,\
  apps/web/app/global-error.tsx

sonar.scm.provider=git
