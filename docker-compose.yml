services:
  backend:
    image: python:3.12-slim
    working_dir: /app
    command: sh -c "pip install uv && bash scripts/dev-backend.sh"
    environment:
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"

  web:
    image: node:22-slim
    working_dir: /app/apps/web
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    volumes:
      - .:/app
    ports:
      - "3000:3000"
